<style>

:root[data-theme="dark"]{--bg:#0e1420;--fg:#e6eaf0;--card:#17202f;--muted:#9aa6b6;--line:#26334a;--head:#0a101a;--accent:#8fb0e6;--now:#4cd08e;--nowbg:#10281e;--tag:#26334a;--badgefg:#0a101a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;line-height:1.4}
header{background:var(--card);color:var(--fg);border-bottom:1px solid var(--line);padding:12px 16px}
.hw{display:flex;justify-content:space-between;align-items:center;gap:12px;max-width:680px;margin:0 auto}
h1{font-size:1.15rem;font-weight:600;letter-spacing:.02em;margin:0}
.sub{font-size:.8rem;opacity:.7;margin-top:2px}
main{max-width:680px;margin:0 auto;padding:16px 16px 40px}
.nav{display:flex;gap:8px;align-items:center;margin-bottom:14px}
.nav .r{flex:1;text-align:center;font-weight:600}
button{background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:7px 14px;font-size:.95rem;cursor:pointer}
button:hover{border-color:var(--accent)}
.day{background:var(--card);border:1px solid var(--line);border-radius:8px;margin-bottom:12px;overflow:hidden}
.day.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}

.item{display:grid;grid-template-columns:112px 1fr;gap:12px;padding:12px 16px;border-top:1px solid var(--line)}
.dh+.item{border-top:0}
.item.now{background:var(--nowbg)}
.t{font-variant-numeric:tabular-nums;font-weight:600;font-size:.92rem}
.c{border-left:4px solid var(--c,#888);padding-left:12px}
.ti{font-weight:600}
.m{color:var(--muted);font-size:.88rem;margin-top:2px}
.tag{display:inline-block;font-size:.72rem;background:var(--tag);border-radius:4px;padding:1px 7px;margin-left:6px;font-weight:500}

.now-b i{width:8px;height:8px;border-radius:50%;background:var(--now);animation:p 1.6s infinite}
@keyframes p{50%{opacity:.25}}
.empty{padding:12px 16px;color:var(--muted)}
.menu{position:relative}

.pop button{display:block;width:100%;text-align:left;border:0;border-radius:6px;padding:10px 12px;background:transparent}
.pop button:hover{background:var(--tag)}
.dp{position:absolute;right:0;top:100%;width:0;height:0;opacity:0;border:0;padding:0}
.sw{position:relative;width:56px;height:30px;padding:0;border-radius:99px;border:1px solid var(--line);background:var(--tag);flex:none}
.sw i{position:absolute;top:2px;left:2px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;font-size:14px;font-style:normal;transition:transform .2s}
.sw[aria-checked="true"] i{transform:translateX(26px)}
.wh{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
.wc{font-size:1.2rem;font-weight:700}
.w{display:grid;grid-template-columns:64px 40px 1fr auto;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin-bottom:8px}
.w.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.wd b{display:block}
.wd span{color:var(--muted);font-size:.8rem}
.wi{font-size:1.7rem;text-align:center}
.wtemp{text-align:right;font-variant-numeric:tabular-nums}
.wtemp b{display:block;font-size:1.05rem}
.wtemp span{color:var(--muted);font-size:.9rem}
.srch{position:relative;display:flex;gap:8px;margin-bottom:14px}
.srch input{flex:1;min-width:0;box-sizing:border-box;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg);font-size:1rem}

.src{color:var(--muted);font-size:.8rem;text-align:center;margin-top:16px}

.logo{font-size:1.9rem;font-weight:800;letter-spacing:.04em;color:var(--fg);text-decoration:none;line-height:1}
.nv{display:flex;align-items:center;gap:2px;margin:0 auto 0 14px}
.nl{position:relative;border:0;background:transparent;border-radius:6px;padding:8px 12px;font-size:1rem;font-weight:500;color:var(--fg)}
.nl:hover{background:var(--tag)}
.nl.on{font-weight:700}
.nl.on::after{content:"";position:absolute;left:12px;right:12px;bottom:1px;height:3px;border-radius:2px;background:var(--accent)}
.sp{left:0;right:auto;min-width:180px}
.pt{font-size:1.25rem;margin:0 0 14px}
@media (max-width:480px){.logo{font-size:1.45rem}.nv{margin-left:6px}.nl{padding:8px 8px}.nl.on::after{left:8px;right:8px}.hw{gap:8px}.item{grid-template-columns:1fr;gap:6px}.w{grid-template-columns:52px 34px 1fr auto;gap:8px;padding:10px}}

const DN=["Понедельник","Вторник","Среда","Четверг","Пятница","Суббота","Воскресенье"];
const COL=["#1e4e8c","#2f7d6d","#a0662a","#6b3f8c","#a13d3d","#3a6b8a","#5f7a2a"];
const pad=n=>String(n).padStart(2,"0");
const key=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const monday=d=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x};
const fmt=d=>d.toLocaleDateString("ru-RU",{day:"numeric",month:"long"});
const color=t=>COL[[...t].reduce((a,c)=>a+c.charCodeAt(0),0)%COL.length];
function isNow(time,d){
  const m=time.match(/(\d+):(\d+)\s*[–-]\s*(\d+):(\d+)/); if(!m)return false;
  const n=new Date(); if(key(d)!==key(n))return false;
  const cur=n.getHours()*60+n.getMinutes();
  return cur>=(+m[1])*60+(+m[2]) && cur<(+m[3])*60+(+m[4]);
}
let start=monday(new Date());
function render(){
  const list=document.getElementById("list");list.innerHTML="";
  const end=new Date(start);end.setDate(end.getDate()+6);
  document.getElementById("range").textContent=fmt(start)+" – "+fmt(end);
  for(let i=0;i<7;i++){
    const d=new Date(start);d.setDate(start.getDate()+i);
    const items=(DATA._weekly&&DATA._weekly[i])||DATA[key(d)], tod=key(d)===key(new Date());
    const el=document.createElement("section");el.className="day"+(tod?" today":"");
    let h='<div class="dh"><div><b>'+DN[i]+'</b>'+(tod?'<span class="badge">Сегодня</span>':'')+'</div><span>'+fmt(d)+'</span></div>';
    if(!items)h+='<div class="empty">Расписание ещё не добавлено</div>';
    else if(!items.length)h+='<div class="empty">Занятий нет</div>';
    else h+=items.map(it=>{const n=isNow(it.time,d);
      return '<div class="item'+(n?' now':'')+'"><div class="t">'+it.time+(it.note?'<span class="tag">'+it.note+'</span>':'')+(n?'<div class="now-b"><i></i>Сейчас идёт</div>':'')+'</div>'+
      '<div class="c" style="--c:'+color(it.title)+'"><div class="ti">'+it.title+'</div><div class="m">'+[it.teacher,it.place].filter(Boolean).join(" · ")+'</div></div></div>';}).join("");
    el.innerHTML=h;list.appendChild(el);
  }
}
document.getElementById("prev").onclick=()=>{start.setDate(start.getDate()-7);render()};
document.getElementById("next").onclick=()=>{start.setDate(start.getDate()+7);render()};
const pop=document.getElementById("pop"),nowBtn=document.getElementById("now"),dp=document.getElementById("dp");
const closeMenu=()=>{pop.hidden=true;nowBtn.setAttribute("aria-expanded","false")};
function goTo(d){
  start=monday(d);render();
  const t=document.querySelector(".day.today");
  if(t)t.scrollIntoView({block:"center",behavior:"smooth"}); else window.scrollTo({top:0,behavior:"smooth"});
}
nowBtn.onclick=e=>{e.stopPropagation();pop.hidden=!pop.hidden;nowBtn.setAttribute("aria-expanded",String(!pop.hidden))};
pop.onclick=e=>{
  const a=e.target.dataset.a; if(!a)return; closeMenu();
  const n=new Date(), w=new Date(monday(n));
  if(a==="today")goTo(n);
  else if(a==="next"){w.setDate(w.getDate()+7);goTo(w)}
  else if(a==="prev"){w.setDate(w.getDate()-7);goTo(w)}
  else if(a==="pick"){dp.value=key(start);dp.showPicker?dp.showPicker():dp.click()}
};
dp.onchange=()=>{if(dp.value){const[y,m,d]=dp.value.split("-").map(Number);goTo(new Date(y,m-1,d))}};
document.addEventListener("click",closeMenu);

async function load(){
  try{
    const host=location.hostname; if(!host.endsWith("github.io"))return;
    const user=host.split(".")[0], seg=location.pathname.split("/")[1];
    const repo=seg||(user+".github.io");
    const r=await fetch("https://raw.githubusercontent.com/"+user+"/"+repo+"/main/schedule.json",{cache:"no-store"});
    if(r.ok){DATA=await r.json();render();}
  }catch(e){}
}

let wTime=0;
function showTab(t){
  document.getElementById("study").classList.toggle("on",t==="schedule");

  document.getElementById("tab-schedule").hidden=t!=="schedule";
  document.getElementById("tab-weather").hidden=t!=="weather";

  try{history.replaceState(null,"","#"+t)}catch(e){}

function wmo(c){
  if(c===0)return["☀️","Ясно"]; if(c<=2)return["⛅","Переменная облачность"]; if(c===3)return["☁️","Пасмурно"];
  if(c<=48)return["🌫️","Туман"]; if(c<=57)return["🌦️","Морось"]; if(c<=67)return["🌧️","Дождь"];
  if(c<=77)return["🌨️","Снег"]; if(c<=82)return["🌧️","Ливень"]; if(c<=86)return["🌨️","Снегопад"]; return["⛈️","Гроза"];
}
const tt=n=>(n>0?"+":"")+Math.round(n)+"°";
async function loadWeather(){
  document.getElementById("wcity").textContent=CITY.name;
  const box=document.getElementById("wlist");
  box.innerHTML='<div class="empty">Загружаю прогноз…</div>';
  try{
    const url="https://api.open-meteo.com/v1/forecast?latitude="+CITY.lat+"&longitude="+CITY.lon+
      "&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum,precipitation_probability_max,wind_speed_10m_max"+
      "&timezone=auto&forecast_days=14&wind_speed_unit=ms";
    const r=await fetch(url); if(!r.ok)throw new Error(r.status);
    const d=(await r.json()).daily;
    box.innerHTML=d.time.map((s,i)=>{
      const dt=new Date(s+"T00:00:00"), [ic,tx]=wmo(d.weather_code[i]);
      const wd=dt.toLocaleDateString("ru-RU",{weekday:"short"});
      const p=d.precipitation_probability_max[i], mm=d.precipitation_sum[i];
      const info=[p!=null?"💧 "+p+"%":"", mm>0?mm.toFixed(1)+" мм":"", "💨 "+Math.round(d.wind_speed_10m_max[i])+" м/с"].filter(Boolean).join(" · ");
      return '<div class="w'+(i?'':' today')+'"><div class="wd"><b>'+wd[0].toUpperCase()+wd.slice(1)+'</b><span>'+dt.toLocaleDateString("ru-RU",{day:"numeric",month:"short"})+'</span></div>'+
        '<div class="wi">'+ic+'</div><div><div class="ti">'+tx+'</div><div class="m">'+info+'</div></div>'+
        '<div class="wtemp"><b>'+tt(d.temperature_2m_max[i])+'</b><span>'+tt(d.temperature_2m_min[i])+'</span></div></div>';
    }).join("");
    wTime=Date.now();
    document.getElementById("wsub").textContent="Прогноз на "+d.time.length+" дн. · обновлено в "+new Date().toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"});
  }catch(e){
    box.innerHTML='<div class="empty">Не удалось загрузить прогноз. Проверьте интернет и попробуйте позже.</div>';
  }
}

/* ---- поиск города ---- */
const cq=document.getElementById("cq"),cres=document.getElementById("cres");
let found=[],timer,seq=0;
async function geocode(q){
  try{
    const r=await fetch("https://geocoding-api.open-meteo.com/v1/search?count=6&language=ru&format=json&name="+encodeURIComponent(q));
    if(!r.ok)throw new Error(r.status);
    return((await r.json()).results||[]).map(c=>({name:c.name,sub:[c.admin1,c.country].filter(Boolean).join(", "),lat:c.latitude,lon:c.longitude}));
  }catch(e){ // запасной источник, если первый недоступен
    const r=await fetch("https://nominatim.openstreetmap.org/search?format=jsonv2&limit=6&accept-language=ru&q="+encodeURIComponent(q));
    if(!r.ok)throw new Error(r.status);
    return(await r.json()).map(c=>({name:c.name||c.display_name.split(",")[0],sub:c.display_name,lat:+c.lat,lon:+c.lon}));
  }
}
async function search(){
  const q=cq.value.trim(); if(q.length<2){cres.hidden=true;found=[];return}
  const my=++seq; cres.hidden=false; cres.innerHTML='<div class="empty" style="padding:8px">Ищу…</div>';
  try{
    const res=await geocode(q); if(my!==seq)return; found=res;
    cres.innerHTML=res.length?res.map((c,i)=>'<button data-i="'+i+'">'+esc(c.name)+'<div class="m">'+esc(c.sub)+'</div></button>').join(""):'<div class="empty" style="padding:8px">Город не найден. Попробуйте другое название.</div>';
  }catch(e){
    if(my===seq){found=[];cres.innerHTML='<div class="empty" style="padding:8px">Не удалось выполнить поиск. Проверьте интернет и попробуйте позже.</div>'}
  }
}
function pick(c){
  CITY={name:c.name,lat:c.lat,lon:c.lon};
  try{localStorage.setItem("city",JSON.stringify(CITY))}catch(e){}
  cres.hidden=true; cq.value=""; loadWeather();
}
async function go(){clearTimeout(timer);await search();if(found.length&&cres.querySelector("button"))pick(found[0])}
cq.oninput=()=>{clearTimeout(timer);timer=setTimeout(search,300)};
cq.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();go()}};
document.getElementById("cgo").onclick=go;
cres.onclick=e=>{const b=e.target.closest("button");if(b)pick(found[+b.dataset.i])};
document.addEventListener("click",e=>{if(!e.target.closest(".srch"))cres.hidden=true});
document.addEventListener("keydown",e=>{if(e.key==="Escape")cres.hidden=true});

render(); setInterval(render,60000); load(); setInterval(load,600000);
showTab(location.hash==="#weather"?"weather":"schedule");
</script></body></html>
